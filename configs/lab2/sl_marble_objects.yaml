scene: sl_marble_objects
decoder: both

training:
  iterations: 500
  learning_rate: 0.01
  decoder_lr: 0.001
  optimizer: rmsprop
  lr_decay_step: 350
  lr_decay_gamma: 0.5
  num_patterns: 5
  neighborhood: 3
  tau: 50.0
  penalty: l1
  init_mode: random

rendering:
  spp: 64
  device: auto

output:
  base_dir: outputs/lab2
  log_interval: 10
  save_interval: 50
