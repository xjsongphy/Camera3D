scene: sl_marble_objects
decoder: both

training:
  iterations: 500
  learning_rate: 0.01
  decoder_lr: 0.001
  seed: 42
  optimizer: rmsprop
  lr_decay_step: 350
  lr_decay_gamma: 0.5
  num_patterns: 5
  neighborhood: 3
  use_projector_response_curve: false
  tau: 50.0
  penalty: l1
  init_mode: random
  max_frequency_ratio: 0.5
  frequency_weight: 0.01

rendering:
  spp: 64
  device: auto

output:
  base_dir: outputs/lab2
  log_interval: 10
  save_interval: 50
