# 默认训练配置
# 用法: uv run python scripts/lab2/run_training.py --config configs/lab2/default.yaml

scene: sl_training_board
decoder: zncc          # zncc / zncc_nn / zncc_nn_response / both

training:
  iterations: 500
  learning_rate: 0.01
  decoder_lr: 0.01     # 仅 zncc_nn 使用
  seed: 42             # 固定随机种子；decoder=both 时每次子训练开始前都会重置为该种子
  num_patterns: 5
  neighborhood: 1       # 1, 3, 5
  use_projector_response_curve: false   # 仅 zncc_nn 使用；true 时启用可学习投影仪响应曲线
  tau: 50.0             # softmax 温度: 小→平滑梯度弱, 大→尖锐梯度强, 50 是平衡值
  penalty: l1           # l1 / zero_tolerance / one_tolerance
  init_mode: random     # random / sine / constant / stripe
  max_frequency_ratio: 0.5  # 相对 Nyquist 的比例；0.5 表示限制到 1/2 Nyquist
  frequency_weight: 0.01    # 高频惩罚权重；设为 0 可仅保留硬低通约束

rendering:
  spp: 64
  device: auto          # auto / cpu / cuda

output:
  base_dir: outputs/lab2
  log_interval: 10
  save_interval: 50

# resume: null          # 取消注释并填入 checkpoint.pt 路径可续训
