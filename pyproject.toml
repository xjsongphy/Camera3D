[project]
name = "camera3d"
version = "0.1.0"
description = "Camera3D labs managed by uv"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
lab1 = [
  "opencv-python-headless>=4.10.0",
  "matplotlib>=3.8.0",
  "pillow>=10.4.0",
]
lab1-yolo = [
  "ultralytics>=8.3.0",
]
lab2 = [
  "matplotlib>=3.8.0",
  "pillow>=10.4.0",
  "mitsuba>=3.6.0",
  "drjit>=1.0.5",
  "imageio>=2.35.0",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.5,<2.8",
  "torchvision>=0.20,<0.23",
]
cu124 = [
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl",
  "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp312-cp312-win_amd64.whl",
]

[project.scripts]
lab1 = "lab1.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lab1", "src/lab2"]
