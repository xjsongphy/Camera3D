[project]
name = "camera3d"
version = "0.1.0"
description = "Camera3D labs managed by uv"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
lab3 = [
  "matplotlib>=3.8.0",
  "pillow>=10.4.0",
  "lpips>=0.1.0",
  "nerfstudio>=1.1.5",
  "tinycudann @ git+https://github.com/NVlabs/tiny-cuda-nn/#subdirectory=bindings/torch",
  # Local gaussian-splatting submodules — paths resolved via [tool.uv.sources]
  "diff-gaussian-rasterization",
  "simple-knn",
  "fused-ssim",
]
lab1 = [
  "opencv-python-headless>=4.10.0",
  "matplotlib>=3.8.0",
  "pillow>=10.4.0",
]
lab1-yolo = [
  "ultralytics>=8.3.0",
]
lab2 = [
  "matplotlib>=3.8.0",
  "pillow>=10.4.0",
  "mitsuba>=3.6.0",
  "drjit>=1.0.5",
  "imageio>=2.35.0",
  "pyyaml>=6.0",
  "opencv-python-headless>=4.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.5,<2.8",
  "torchvision>=0.20,<0.23",
]
cu124 = [
  # Windows
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  # Linux
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
  "torchvision @ https://download.pytorch.org/whl/cu124/torchvision-0.20.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]

[project.scripts]
lab1 = "lab1.cli:main"
lab3 = "lab3.cli:main"
lab3-viewer = "lab3.nerfstudio_viewer:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
prerelease = "allow"
override-dependencies = [
  "pymeshlab==2023.12.post1; sys_platform == 'win32'",
]

[tool.uv.sources]
# Local gaussian-splatting submodules, relative to project root (cross-platform).
diff-gaussian-rasterization = { path = "gaussian-splatting/submodules/diff-gaussian-rasterization" }
simple-knn = { path = "gaussian-splatting/submodules/simple-knn" }
fused-ssim = { path = "gaussian-splatting/submodules/fused-ssim" }

[tool.uv.extra-build-dependencies]
# CUDA submodules of gaussian-splatting import torch at build time
# (setup.py -> torch.utils.cpp_extension). Inject the cu124 torch into
# their isolated build environments (cross-platform, mirrors tinycudann).
diff-gaussian-rasterization = [
  "setuptools",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]
simple-knn = [
  "setuptools",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]
fused-ssim = [
  "setuptools",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]
tinycudann = [
  "setuptools==70.2.0",
  # Windows
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-win_amd64.whl ; sys_platform == 'win32'",
  # Linux
  "torch @ https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp312-cp312-linux_x86_64.whl ; sys_platform == 'linux'",
]

[tool.uv.extra-build-variables]
# Keep project-level build variables machine-agnostic. CUDA toolchain locations
# should come from the user's shell environment rather than being hardcoded here.
tinycudann = { TORCH_CUDA_ARCH_LIST = "8.9" }

# CUDA/nvcc paths are host-specific. Ensure `nvcc` is on PATH (for example via
# `/usr/local/cuda/bin`) and export `CUDA_HOME` in your shell only if autodiscovery
# is not enough for your setup.

[tool.hatch.build.targets.wheel]
packages = ["src/lab1", "src/lab2", "src/lab3"]
